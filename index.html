<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Star Hue Byte Tester</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 { font-size: 1.3rem; margin-top: 0; text-align: center; color: var(--accent); }

        .status-badge {
            text-align: center;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-connect { background: #10b981; color: white; }
        .btn-on { background: #22c55e; color: white; }
        .btn-off { background: #ef4444; color: white; }
        .btn-test { background: #8b5cf6; color: white; }

        .control-group {
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 0.9rem; font-weight: bold; }

        #log {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #a7f3d0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MR Star Hue Tester</h1>
    <div id="status" class="status-badge">Status: Disconnected</div>

    <button id="connectBtn" class="btn btn-connect">Connect to GATT--DEMO</button>

    <div style="display: flex; gap: 8px; margin: 10px 0;">
        <button id="powerOnBtn" class="btn btn-on" disabled>Power ON</button>
        <button id="powerOffBtn" class="btn btn-off" disabled>Power OFF</button>
    </div>

    <div class="control-group">
        <label>Test Color Wheel Byte (Byte Index 6):</label>
        <button class="btn btn-test" onclick="sendHueByte(0x00)" id="h1" disabled>Test Hue 0x00</button>
        <button class="btn btn-test" onclick="sendHueByte(0x50)" id="h2" disabled>Test Hue 0x50</button>
        <button class="btn btn-test" onclick="sendHueByte(0xA0)" id="h3" disabled>Test Hue 0xA0</button>
        <button class="btn btn-test" onclick="sendHueByte(0xFF)" id="h4" disabled>Test Hue 0xFF</button>
    </div>

    <h3>BLE Packet Log</h3>
    <div id="log">Click connect to start...</div>
</div>

<script>
    let bleDevice = null;
    let targetCharacteristic = null;

    const connectBtn = document.getElementById('connectBtn');
    const powerOnBtn = document.getElementById('powerOnBtn');
    const powerOffBtn = document.getElementById('powerOffBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    function log(msg) {
        logDiv.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log("Scanning for device...");
            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000fff0-0000-1000-8000-00805f9b34fb',
                    '0000ffe0-0000-1000-8000-00805f9b34fb'
                ]
            });

            const server = await bleDevice.gatt.connect();
            const services = await server.getPrimaryServices();

            for (const service of services) {
                const chars = await service.getCharacteristics();
                for (const char of chars) {
                    if (char.uuid.includes('fff3') || char.properties.write || char.properties.writeWithoutResponse) {
                        targetCharacteristic = char;
                        break;
                    }
                }
                if (targetCharacteristic) break;
            }

            if (targetCharacteristic) {
                statusDiv.innerText = `Connected: ${bleDevice.name}`;
                powerOnBtn.disabled = false;
                powerOffBtn.disabled = false;
                document.getElementById('h1').disabled = false;
                document.getElementById('h2').disabled = false;
                document.getElementById('h3').disabled = false;
                document.getElementById('h4').disabled = false;
                connectBtn.style.display = 'none';
                log(`Connected successfully!`);
            }
        } catch (error) {
            log(`Error: ${error}`);
        }
    });

    powerOnBtn.addEventListener('click', async () => {
        await sendBytes(new Uint8Array([0xbc, 0x01, 0x01, 0x01, 0x55]));
        log("Power ON sent");
    });

    powerOffBtn.addEventListener('click', async () => {
        await sendBytes(new Uint8Array([0xbc, 0x01, 0x01, 0x00, 0x55]));
        log("Power OFF sent");
    });

    async function sendHueByte(hueVal) {
        // Testing changing the 7th byte position (index 6) which was 0x85 / 0x38 / 0xe0 in the logs
        const packet = new Uint8Array([0xbc, 0x04, 0x06, 0x00, 0x00, 0x03, hueVal, 0x00, 0x00, 0x55]);
        await sendBytes(packet);
        log(`Sent Hue test byte: 0x${hueVal.toString(16).padStart(2, '0')}`);
    }

    async function sendBytes(byteArray) {
        if (!targetCharacteristic) return;
        try {
            if (targetCharacteristic.properties.writeWithoutResponse) {
                await targetCharacteristic.writeValueWithoutResponse(byteArray);
            } else {
                await targetCharacteristic.writeValueWithResponse(byteArray);
            }
            log(`TX -> [${Array.from(byteArray).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}]`);
        } catch (err) {
            log(`Write error: ${err}`);
        }
    }
</script>
</body>
</html>
