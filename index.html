<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Star HSV Controller</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 { font-size: 1.3rem; margin-top: 0; text-align: center; color: var(--accent); }

        .status-badge {
            text-align: center;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-connect { background: #10b981; color: white; }
        .btn-on { background: #22c55e; color: white; }
        .btn-off { background: #ef4444; color: white; }

        .control-group {
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 0.9rem; font-weight: bold; }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        #log {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #a7f3d0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MR Star HSV Controller</h1>
    <div id="status" class="status-badge">Status: Disconnected</div>

    <button id="connectBtn" class="btn btn-connect">Connect to GATT--DEMO</button>

    <div style="display: flex; gap: 8px; margin: 10px 0;">
        <button id="powerOnBtn" class="btn btn-on" disabled>Power ON</button>
        <button id="powerOffBtn" class="btn btn-off" disabled>Power OFF</button>
    </div>

    <div class="control-group">
        <label for="colorPicker">Color Picker:</label>
        <input type="color" id="colorPicker" value="#ff0000" disabled>
    </div>

    <h3>BLE Packet Log</h3>
    <div id="log">Click connect to start...</div>
</div>

<script>
    let bleDevice = null;
    let targetCharacteristic = null;

    const connectBtn = document.getElementById('connectBtn');
    const colorPicker = document.getElementById('colorPicker');
    const powerOnBtn = document.getElementById('powerOnBtn');
    const powerOffBtn = document.getElementById('powerOffBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    function log(msg) {
        logDiv.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log("Scanning for device...");
            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000fff0-0000-1000-8000-00805f9b34fb',
                    '0000ffe0-0000-1000-8000-00805f9b34fb'
                ]
            });

            log(`Found: ${bleDevice.name}`);
            statusDiv.innerText = `Connecting...`;

            const server = await bleDevice.gatt.connect();
            const services = await server.getPrimaryServices();

            for (const service of services) {
                const chars = await service.getCharacteristics();
                for (const char of chars) {
                    if (char.uuid.includes('fff3') || char.properties.write || char.properties.writeWithoutResponse) {
                        targetCharacteristic = char;
                        break;
                    }
                }
                if (targetCharacteristic) break;
            }

            if (targetCharacteristic) {
                statusDiv.innerText = `Connected: ${bleDevice.name}`;
                colorPicker.disabled = false;
                powerOnBtn.disabled = false;
                powerOffBtn.disabled = false;
                connectBtn.style.display = 'none';
                log(`Locked onto handle 0x0003 successfully!`);
            } else {
                log("Error: No writeable characteristic found!");
            }

        } catch (error) {
            log(`Error: ${error}`);
            statusDiv.innerText = "Connection Failed";
        }
    });

    powerOnBtn.addEventListener('click', async () => {
        const packet = new Uint8Array([0xbc, 0x01, 0x01, 0x01, 0x55]);
        await sendBytes(packet);
        log("Power ON sent");
    });

    powerOffBtn.addEventListener('click', async () => {
        const packet = new Uint8Array([0xbc, 0x01, 0x01, 0x00, 0x55]);
        await sendBytes(packet);
        log("Power OFF sent");
    });

    // Converts Hex Color to HSV bytes matching the firmware's native color wheel mapping
    colorPicker.addEventListener('input', async (e) => {
        const hex = e.target.value;
        const r = parseInt(hex.substring(1, 3), 16) / 255;
        const g = parseInt(hex.substring(3, 5), 16) / 255;
        const b = parseInt(hex.substring(5, 7), 16) / 255;

        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, v = max;
        const d = max - min;
        s = max === 0 ? 0 : d / max;

        if (max === min) {
            h = 0;
        } else {
            switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
            }
            h /= 6;
        }

        // Map Hue (0-1) into a 16-bit integer index matching the log's wheel bytes
        const hueVal = Math.floor(h * 360);
        const highByte = (hueVal >> 8) & 0xFF;
        const lowByte = hueVal & 0xFF;
        const satByte = Math.floor(s * 255);

        // Packet structure: [bc, 04, 06, state, highHue, lowHue, saturation, 00, 00, 55]
        const packet = new Uint8Array([0xbc, 0x04, 0x06, 0x00, highByte, lowByte, satByte, 0x00, 0x00, 0x55]);
        await sendBytes(packet);
    });

    async function sendBytes(byteArray) {
        if (!targetCharacteristic) return;
        try {
            if (targetCharacteristic.properties.writeWithoutResponse) {
                await targetCharacteristic.writeValueWithoutResponse(byteArray);
            } else {
                await targetCharacteristic.writeValueWithResponse(byteArray);
            }
            log(`TX -> [${Array.from(byteArray).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}]`);
        } catch (err) {
            log(`Write error: ${err}`);
        }
    }
</script>
</body>
</html>
