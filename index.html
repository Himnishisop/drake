<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATT--DEMO Color & Dimmer</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.3rem;
            margin-top: 0;
            text-align: center;
            color: var(--accent);
        }

        .status-badge {
            text-align: center;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-connect { background: #10b981; color: white; }
        
        .control-group {
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 0.9rem; font-weight: bold; }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        #log {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #a7f3d0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GATT--DEMO Controller</h1>
    <div id="status" class="status-badge">Status: Disconnected</div>

    <button id="connectBtn" class="btn btn-connect">Connect to GATT--DEMO</button>

    <div class="control-group">
        <label for="colorPicker">Pick Rope Light Color:</label>
        <input type="color" id="colorPicker" value="#ff0000" disabled>
    </div>

    <h3>BLE Packet Log</h3>
    <div id="log">Click connect to start...</div>
</div>

<script>
    let bleDevice = null;
    let targetCharacteristic = null;

    const connectBtn = document.getElementById('connectBtn');
    const colorPicker = document.getElementById('colorPicker');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    function log(msg) {
        logDiv.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log("Scanning for device...");
            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000fff0-0000-1000-8000-00805f9b34fb',
                    '0000ffe0-0000-1000-8000-00805f9b34fb'
                ]
            });

            log(`Found: ${bleDevice.name || 'Device'}`);
            statusDiv.innerText = `Connecting...`;

            const server = await bleDevice.gatt.connect();
            const services = await server.getPrimaryServices();

            for (const service of services) {
                const chars = await service.getCharacteristics();
                for (const char of chars) {
                    if (char.properties.write || char.properties.writeWithoutResponse) {
                        targetCharacteristic = char;
                        break;
                    }
                }
                if (targetCharacteristic) break;
            }

            if (targetCharacteristic) {
                statusDiv.innerText = `Connected: ${bleDevice.name}`;
                colorPicker.disabled = false;
                connectBtn.style.display = 'none';
                log(`Locked onto characteristic: ${targetCharacteristic.uuid}`);
            } else {
                log("Error: No writeable characteristic found!");
            }

        } catch (error) {
            log(`Error: ${error}`);
            statusDiv.innerText = "Connection Failed";
        }
    });

    // Color Picker Action (Sends standard MagicLight / generic RGB packet structure)
    colorPicker.addEventListener('input', async (e) => {
        const hex = e.target.value;
        const r = parseInt(hex.substring(1, 3), 16);
        const g = parseInt(hex.substring(3, 5), 16);
        const b = parseInt(hex.substring(5, 7), 16);

        // Standard 9-byte structure that usually triggers the color routine (which caused your cyan flash)
        // Let's format it cleanly: [0x7E, Length, Command, Subcommand, R, G, B, White/Reserved, Checksum/End]
        const packet = new Uint8Array([0x7E, 0x07, 0x05, 0x03, r, g, b, 0x00, 0xEF]);
        
        await sendBytes(packet);
    });

    async function sendBytes(byteArray) {
        if (!targetCharacteristic) return;
        try {
            if (targetCharacteristic.properties.writeWithoutResponse) {
                await targetCharacteristic.writeValueWithoutResponse(byteArray);
            } else {
                await targetCharacteristic.writeValueWithResponse(byteArray);
            }
            log(`TX -> [${Array.from(byteArray).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}]`);
        } catch (err) {
            log(`Write error: ${err}`);
        }
    }
</script>
</body>
</html>
