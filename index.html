<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Light Control Panel</title>
    <style>
        body { background: #0f0f0f; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { margin-bottom: 20px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px; margin: 15px auto; max-width: 400px; }
        button { padding: 12px 20px; margin: 5px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        .btn-on { background: #22c55e; }
        .btn-off { background: #ef4444; }
        .btn-all { background: #3b82f6; width: 40%; }
    </style>
</head>
<body>

    <h1>ESP32 RGB Command Center</h1>

    <!-- Master Controls -->
    <div class="card">
        <h3>Master Control</h3>
        <button class="btn-all" onclick="sendCmd('all/on')">ALL ON</button>
        <button class="btn-all" onclick="sendCmd('all/off')">ALL OFF</button>
    </div>

    <!-- ELK-BLEDOB -->
    <div class="card">
        <h3>ELK-BLEDOB</h3>
        <button class="btn-on" onclick="sendCmd('elk/on')">ON</button>
        <button class="btn-off" onclick="sendCmd('elk/off')">OFF</button>
    </div>

    <!-- GATT--DEMO -->
    <div class="card">
        <h3>GATT--DEMO</h3>
        <button class="btn-on" onclick="sendCmd('gattdemo/on')">ON</button>
        <button class="btn-off" onclick="sendCmd('gattdemo/off')">OFF</button>
    </div>

    <!-- CLK-BLEDDM -->
    <div class="card">
        <h3>CLK-BLEDDM</h3>
        <button class="btn-on" onclick="sendCmd('clk/on')">ON</button>
        <button class="btn-off" onclick="sendCmd('clk/off')">OFF</button>
    </div>

    <script>
        // Change this to your ESP32's static IP address
        const espIP = "http://192.168.1.160";

        function sendCmd(endpoint) {
            // Uses 'no-cors' mode or simple fetch to fire and forget instantly without waiting for heavy responses
            fetch(`${espIP}/${endpoint}`, { method: 'GET', mode: 'no-cors' })
                .then(() => console.log(`Command sent: ${endpoint}`))
                .catch(err => console.error("Error sending command:", err));
        }
    </script>

</body>
</html>
