<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Star Channel Calibrator</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.3rem;
            margin-top: 0;
            text-align: center;
            color: var(--accent);
        }

        .status-badge {
            text-align: center;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-connect { background: #10b981; color: white; }
        .btn-power { background: #6366f1; color: white; }

        .control-group {
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 0.9rem; font-weight: bold; }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            font-size: 0.9rem;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        #log {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #a7f3d0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MR Star Calibrator</h1>
    <div id="status" class="status-badge">Status: Disconnected</div>

    <button id="connectBtn" class="btn btn-connect">Connect to GATT--DEMO</button>

    <div class="control-group">
        <label for="colorOrderSelect">Select RGB Channel Layout:</label>
        <select id="colorOrderSelect" disabled>
            <option value="rgb">RGB (Standard)</option>
            <option value="grb">GRB (Green-Red-Blue)</option>
            <option value="brg">BRG (Blue-Red-Green)</option>
            <option value="rbg">RBG (Red-Blue-Green)</option>
            <option value="gbr">GBR (Green-Blue-Red)</option>
            <option value="bgr">BGR (Blue-Green-Red)</option>
        </select>
    </div>

    <div class="control-group">
        <label for="colorPicker">Color Picker:</label>
        <input type="color" id="colorPicker" value="#ff0000" disabled>
    </div>

    <button id="togglePowerBtn" class="btn btn-power" disabled>Toggle Power</button>

    <h3>BLE Packet Log</h3>
    <div id="log">Click connect to start...</div>
</div>

<script>
    let bleDevice = null;
    let targetCharacteristic = null;
    let powerState = 0x00;

    const connectBtn = document.getElementById('connectBtn');
    const colorPicker = document.getElementById('colorPicker');
    const colorOrderSelect = document.getElementById('colorOrderSelect');
    const togglePowerBtn = document.getElementById('togglePowerBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    function log(msg) {
        logDiv.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log("Scanning for device...");
            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000fff0-0000-1000-8000-00805f9b34fb',
                    '0000ffe0-0000-1000-8000-00805f9b34fb'
                ]
            });

            log(`Found: ${bleDevice.name}`);
            statusDiv.innerText = `Connecting...`;

            const server = await bleDevice.gatt.connect();
            const services = await server.getPrimaryServices();

            for (const service of services) {
                const chars = await service.getCharacteristics();
                for (const char of chars) {
                    if (char.uuid.includes('fff3') || char.properties.write || char.properties.writeWithoutResponse) {
                        targetCharacteristic = char;
                        break;
                    }
                }
                if (targetCharacteristic) break;
            }

            if (targetCharacteristic) {
                statusDiv.innerText = `Connected: ${bleDevice.name}`;
                colorPicker.disabled = false;
                colorOrderSelect.disabled = false;
                togglePowerBtn.disabled = false;
                connectBtn.style.display = 'none';
                log(`Locked onto handle 0x0003 (${targetCharacteristic.uuid})`);
            } else {
                log("Error: No writeable characteristic found!");
            }

        } catch (error) {
            log(`Error: ${error}`);
            statusDiv.innerText = "Connection Failed";
        }
    });

    async function sendCurrentColor() {
        const hex = colorPicker.value;
        const r = parseInt(hex.substring(1, 3), 16);
        const g = parseInt(hex.substring(3, 5), 16);
        const b = parseInt(hex.substring(5, 7), 16);

        const layout = colorOrderSelect.value;
        let c1 = r, c2 = g, c3 = b;

        if (layout === 'grb') { c1 = g; c2 = r; c3 = b; }
        else if (layout === 'brg') { c1 = b; c2 = r; c3 = g; }
        else if (layout === 'rbg') { c1 = r; c2 = b; c3 = g; }
        else if (layout === 'gbr') { c1 = g; c2 = b; c3 = r; }
        else if (layout === 'bgr') { c1 = b; c2 = g; c3 = r; }

        const packet = new Uint8Array([0xbc, 0x04, 0x06, powerState, c1, c2, c3, 0x00, 0x00, 0x55]);
        await sendBytes(packet);
    }

    colorPicker.addEventListener('input', sendCurrentColor);
    colorOrderSelect.addEventListener('change', () => {
        log(`Switched layout to: ${colorOrderSelect.value.toUpperCase()}`);
        sendCurrentColor();
    });

    togglePowerBtn.addEventListener('click', async () => {
        powerState = powerState === 0x00 ? 0x01 : 0x00;
        const packet = new Uint8Array([0xbc, 0x04, 0x06, powerState, 0xff, 0xff, 0xff, 0x00, 0x00, 0x55]);
        await sendBytes(packet);
        log(`Power state toggled: ${powerState === 0x00 ? 'ON' : 'OFF'}`);
    });

    async function sendBytes(byteArray) {
        if (!targetCharacteristic) return;
        try {
            if (targetCharacteristic.properties.writeWithoutResponse) {
                await targetCharacteristic.writeValueWithoutResponse(byteArray);
            } else {
                await targetCharacteristic.writeValueWithResponse(byteArray);
            }
            log(`TX -> [${Array.from(byteArray).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}]`);
        } catch (err) {
            log(`Write error: ${err}`);
        }
    }
</script>
</body>
</html>
