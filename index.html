<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GATT--DEMO Tester</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.3rem;
            margin-top: 0;
            text-align: center;
            color: var(--accent);
        }

        .status-badge {
            text-align: center;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-connect { background: #10b981; color: white; }
        .btn-power { background: #ef4444; color: white; }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 12px 0;
        }

        .btn-test { background: #6366f1; color: white; font-size: 0.85rem; padding: 10px; }

        .control-group {
            margin: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label { font-size: 0.85rem; font-weight: bold; }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }

        #log {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            height: 160px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #a7f3d0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GATT--DEMO Tester</h1>
    <div id="status" class="status-badge">Status: Disconnected</div>

    <button id="connectBtn" class="btn btn-connect">Connect & Probe BLE Services</button>

    <div class="control-group">
        <label for="charSelect">Discovered Write Characteristic:</label>
        <select id="charSelect" disabled><option>Connect to populate...</option></select>
    </div>

    <div class="control-group">
        <label for="brightnessSlider">PWM Brightness Level (0-255):</label>
        <input type="range" id="brightnessSlider" min="0" max="255" value="255" disabled>
    </div>

    <label>Quick Protocol Payload Tests:</label>
    <div class="btn-grid">
        <button id="btnP1" class="btn btn-test" disabled>Format 1 (0x56 PWM)</button>
        <button id="btnP2" class="btn btn-test" disabled>Format 2 (0x7E RGB)</button>
        <button id="btnP3" class="btn btn-test" disabled>Format 3 (0xCC Toggle)</button>
        <button id="btnP4" class="btn btn-test" disabled>Format 4 (0xAA Single)</button>
    </div>

    <div class="control-group">
        <label for="customHex">Send Custom Hex String (e.g. 53 ff 00 ef):</label>
        <div style="display:flex; gap:8px;">
            <input type="text" id="customHex" placeholder="53 ff 00 ef" disabled>
            <button id="sendHexBtn" class="btn btn-test" style="width: auto; padding: 0 16px;" disabled>Send</button>
        </div>
    </div>

    <h3>BLE Packet Log</h3>
    <div id="log">Ready to connect...</div>
</div>

<script>
    let bleDevice = null;
    let targetCharacteristic = null;
    let discoveredCharacteristics = [];

    const connectBtn = document.getElementById('connectBtn');
    const charSelect = document.getElementById('charSelect');
    const brightnessSlider = document.getElementById('brightnessSlider');
    const customHexInput = document.getElementById('customHex');
    const sendHexBtn = document.getElementById('sendHexBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    const btnP1 = document.getElementById('btnP1');
    const btnP2 = document.getElementById('btnP2');
    const btnP3 = document.getElementById('btnP3');
    const btnP4 = document.getElementById('btnP4');

    function log(msg) {
        logDiv.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log("Opening BLE Browser Picker...");
            
            // acceptAllDevices avoids UUID formatting syntax errors completely
            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000fff0-0000-1000-8000-00805f9b34fb',
                    '0000ffe0-0000-1000-8000-00805f9b34fb',
                    '0000ffd0-0000-1000-8000-00805f9b34fb',
                    '0000180a-0000-1000-8000-00805f9b34fb'
                ]
            });

            log(`Device picked: ${bleDevice.name || 'Unnamed Device'}`);
            statusDiv.innerText = `Connecting...`;

            const server = await bleDevice.gatt.connect();
            log("GATT Server connected! Querying services...");

            const services = await server.getPrimaryServices();
            charSelect.innerHTML = '';
            discoveredCharacteristics = [];

            for (const service of services) {
                log(`Service: ${service.uuid}`);
                try {
                    const chars = await service.getCharacteristics();
                    for (const char of chars) {
                        const canWrite = char.properties.write || char.properties.writeWithoutResponse;
                        log(` - Char: ${char.uuid} (Writeable: ${canWrite})`);
                        if (canWrite) {
                            discoveredCharacteristics.push(char);
                            const opt = document.createElement('option');
                            opt.value = discoveredCharacteristics.length - 1;
                            opt.innerText = `${char.uuid.substring(0, 8)}... (${char.properties.writeWithoutResponse ? 'NoResp' : 'Write'})`;
                            charSelect.appendChild(opt);
                        }
                    }
                } catch(e) {
                    log(` Could not inspect chars for ${service.uuid}`);
                }
            }

            if (discoveredCharacteristics.length > 0) {
                targetCharacteristic = discoveredCharacteristics[0];
                statusDiv.innerText = `Connected: ${bleDevice.name}`;
                enableControls(true);
                log(`Selected initial write char: ${targetCharacteristic.uuid}`);
            } else {
                log("No writeable characteristics discovered!");
            }

        } catch (error) {
            log(`Error: ${error}`);
            statusDiv.innerText = "Connection Failed";
        }
    });

    charSelect.addEventListener('change', (e) => {
        targetCharacteristic = discoveredCharacteristics[e.target.value];
        log(`Switched target char to: ${targetCharacteristic.uuid}`);
    });

    function enableControls(enable) {
        brightnessSlider.disabled = !enable;
        customHexInput.disabled = !enable;
        sendHexBtn.disabled = !enable;
        charSelect.disabled = !enable;
        btnP1.disabled = !enable;
        btnP2.disabled = !enable;
        btnP3.disabled = !enable;
        btnP4.disabled = !enable;
    }

    // PWM Slider test (0x53 Header)
    brightnessSlider.addEventListener('input', async (e) => {
        const val = parseInt(e.target.value);
        await sendBytes(new Uint8Array([0x53, val, 0x00, 0xef]));
    });

    // Preset tests
    btnP1.addEventListener('click', () => sendBytes(new Uint8Array([0x56, 0xff, 0xff, 0xff, 0x00, 0xf0, 0xaa])));
    btnP2.addEventListener('click', () => sendBytes(new Uint8Array([0x7e, 0x07, 0x05, 0x03, 0xff, 0xff, 0xff, 0x00, 0xef])));
    btnP3.addEventListener('click', () => sendBytes(new Uint8Array([0xcc, 0x23, 0x33])));
    btnP4.addEventListener('click', () => sendBytes(new Uint8Array([0xaa, 0x01, 0x00, 0x55])));

    // Custom Hex Sender
    sendHexBtn.addEventListener('click', async () => {
        const raw = customHexInput.value.trim().replace(/[^0-9a-fA-F]/g, '');
        if (!raw || raw.length % 2 !== 0) {
            log("Invalid hex string!");
            return;
        }
        const bytes = new Uint8Array(raw.match(/.{1,2}/g).map(byte => parseInt(byte, 16)));
        await sendBytes(bytes);
    });

    async function sendBytes(byteArray) {
        if (!targetCharacteristic) return;
        try {
            if (targetCharacteristic.properties.writeWithoutResponse) {
                await targetCharacteristic.writeValueWithoutResponse(byteArray);
            } else {
                await targetCharacteristic.writeValueWithResponse(byteArray);
            }
            log(`TX -> [${Array.from(byteArray).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}]`);
        } catch (err) {
            log(`Write Error: ${err}`);
        }
    }
</script>
</body>
</html>
