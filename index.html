<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MR Star Protocol Suite</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.3rem;
            margin-top: 0;
            text-align: center;
            color: var(--accent);
        }

        .status-badge {
            text-align: center;
            font-size: 0.85rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
            margin-bottom: 16px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-connect { background: #10b981; color: white; }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }

        .btn-variant {
            background: #6366f1;
            color: white;
            font-size: 0.8rem;
            padding: 10px;
        }

        .control-group {
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 0.9rem; font-weight: bold; }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        #log {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.75rem;
            color: #a7f3d0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>MR Star Protocol Suite</h1>
    <div id="status" class="status-badge">Status: Disconnected</div>

    <button id="connectBtn" class="btn btn-connect">Connect to GATT--DEMO</button>

    <div class="control-group">
        <label for="colorPicker">Color Picker:</label>
        <input type="color" id="colorPicker" value="#ff0000" disabled>
    </div>

    <label>Active MR Star Variant Protocol:</label>
    <div class="grid">
        <button id="var1" class="btn btn-variant" disabled>V1 (0x7E 0x05)</button>
        <button id="var2" class="btn btn-variant" disabled>V2 (0xAA RGB)</button>
        <button id="var3" class="btn btn-variant" disabled>V3 (0xFB RGB)</button>
        <button id="var4" class="btn btn-variant" disabled>V4 (0x7E Checksum)</button>
    </div>

    <h3>BLE Packet Log</h3>
    <div id="log">Click connect to start...</div>
</div>

<script>
    let bleDevice = null;
    let targetCharacteristic = null;
    let currentMode = 1;

    const connectBtn = document.getElementById('connectBtn');
    const colorPicker = document.getElementById('colorPicker');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    const v1Btn = document.getElementById('var1');
    const v2Btn = document.getElementById('var2');
    const v3Btn = document.getElementById('var3');
    const v4Btn = document.getElementById('var4');

    function log(msg) {
        logDiv.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log("Scanning for device...");
            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    '0000fff0-0000-1000-8000-00805f9b34fb',
                    '0000ffe0-0000-1000-8000-00805f9b34fb'
                ]
            });

            log(`Found: ${bleDevice.name || 'Unnamed'}`);
            statusDiv.innerText = `Connecting...`;

            const server = await bleDevice.gatt.connect();
            const services = await server.getPrimaryServices();

            for (const service of services) {
                const chars = await service.getCharacteristics();
                for (const char of chars) {
                    if (char.properties.write || char.properties.writeWithoutResponse) {
                        targetCharacteristic = char;
                        break;
                    }
                }
                if (targetCharacteristic) break;
            }

            if (targetCharacteristic) {
                statusDiv.innerText = `Connected: ${bleDevice.name}`;
                colorPicker.disabled = false;
                v1Btn.disabled = false;
                v2Btn.disabled = false;
                v3Btn.disabled = false;
                v4Btn.disabled = false;
                connectBtn.style.display = 'none';
                log(`Locked onto char: ${targetCharacteristic.uuid}`);
            } else {
                log("Error: No writeable characteristic found!");
            }

        } catch (error) {
            log(`Error: ${error}`);
            statusDiv.innerText = "Connection Failed";
        }
    });

    // Set Variant Modes
    v1Btn.addEventListener('click', () => setVariant(1, "V1 (0x7E 0x05 Standard)"));
    v2Btn.addEventListener('click', () => setVariant(2, "V2 (0xAA RGB Format)"));
    v3Btn.addEventListener('click', () => setVariant(3, "V3 (0xFB Symphony Format)"));
    v4Btn.addEventListener('click', () => setVariant(4, "V4 (0x7E Sum-Checksum)"));

    function setVariant(m, name) {
        currentMode = m;
        log(`Switched active test protocol to: ${name}`);
    }

    // Color Picker Callback
    colorPicker.addEventListener('input', async (e) => {
        const hex = e.target.value;
        const r = parseInt(hex.substring(1, 3), 16);
        const g = parseInt(hex.substring(3, 5), 16);
        const b = parseInt(hex.substring(5, 7), 16);

        let packet;

        if (currentMode === 1) {
            // FINDN Variant 1: 0x7E header with 0x05 opcode
            packet = new Uint8Array([0x7e, 0x07, 0x05, 0x03, r, g, b, 0x00, 0xef]);
        } else if (currentMode === 2) {
            // FINDN Variant 2: 0xAA header format
            packet = new Uint8Array([0xaa, 0x01, r, g, b, 0x55]);
        } else if (currentMode === 3) {
            // FINDN Variant 3: 0xFB Symphony/MR Star Format
            packet = new Uint8Array([0xfb, 0x04, r, g, b, 0x00, 0x00]);
        } else if (currentMode === 4) {
            // FINDN Variant 4: Calculated Checksum Format
            const checksum = (r + g + b + 0x05 + 0x03) & 0xFF;
            packet = new Uint8Array([0x7e, 0x05, 0x03, r, g, b, checksum, 0xef]);
        }

        await sendBytes(packet);
    });

    async function sendBytes(byteArray) {
        if (!targetCharacteristic) return;
        try {
            if (targetCharacteristic.properties.writeWithoutResponse) {
                await targetCharacteristic.writeValueWithoutResponse(byteArray);
            } else {
                await targetCharacteristic.writeValueWithResponse(byteArray);
            }
            log(`TX -> [${Array.from(byteArray).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}]`);
        } catch (err) {
            log(`Write error: ${err}`);
        }
    }
</script>
</body>
</html>
