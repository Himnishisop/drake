<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rope Light Dimmer Controller</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            text-align: center;
            color: var(--accent);
        }

        .status-badge {
            text-align: center;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-connect { background: #10b981; color: white; }
        .btn-connect:hover { background: #059669; }

        .btn-power { background: #ef4444; color: white; }
        .btn-power:hover { background: #dc2626; }

        .btn-mode { background: #6366f1; color: white; }
        .btn-mode:hover { background: #4f46e5; }

        .control-group {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        #log {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: #a7f3d0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GATT--DEMO Dimmer</h1>
    <div id="status" class="status-badge">Status: Disconnected</div>

    <button id="connectBtn" class="btn btn-connect">Connect to GATT--DEMO</button>

    <div class="control-group">
        <label for="brightnessSlider">Brightness / Intensity:</label>
        <input type="range" id="brightnessSlider" min="0" max="255" value="255" disabled>
    </div>

    <button id="togglePowerBtn" class="btn btn-power" disabled>Toggle Power (On/Off)</button>
    <button id="modeBtn" class="btn btn-mode" disabled>Cycle Pattern / Mode</button>

    <h3>BLE Packet Log</h3>
    <div id="log">Click "Connect" to scan for GATT--DEMO...</div>
</div>

<script>
    let bleDevice = null;
    let targetCharacteristic = null;
    let isPowerOn = true;

    const connectBtn = document.getElementById('connectBtn');
    const brightnessSlider = document.getElementById('brightnessSlider');
    const togglePowerBtn = document.getElementById('togglePowerBtn');
    const modeBtn = document.getElementById('modeBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    function log(msg) {
        logDiv.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log("Scanning for BLE devices...");
            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'GATT--' }],
                optionalServices: ['000fff0-0000-1000-8000-00805f9b34fb']
            });

            log(`Found: ${bleDevice.name}`);
            statusDiv.innerText = `Connecting...`;

            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService('000fff0-0000-1000-8000-00805f9b34fb');
            targetCharacteristic = await service.getCharacteristic('000fff3-0000-1000-8000-00805f9b34fb');

            log("--> Connected & locked onto write characteristic!");
            statusDiv.innerText = `Connected: ${bleDevice.name}`;
            brightnessSlider.disabled = false;
            togglePowerBtn.disabled = false;
            modeBtn.disabled = false;
            connectBtn.style.display = 'none';

        } catch (error) {
            log(`Error: ${error}`);
            statusDiv.innerText = "Connection Failed";
        }
    });

    // Brightness Slider Control (Sends varying intensity bytes)
    brightnessSlider.addEventListener('input', async (e) => {
        const val = parseInt(e.target.value);
        
        // Testing common single-channel PWM framing variants:
        // Variant A: [Header, BrightnessValue, Footer] -> e.g., 0x53 or 0xbb
        const packet = new Uint8Array([0x53, val, 0x00, 0xef]);
        
        await sendBytes(packet);
    });

    // Power Toggle Button
    togglePowerBtn.addEventListener('click', async () => {
        isPowerOn = !isPowerOn;
        const val = isPowerOn ? 255 : 0;
        
        // Send power-state byte packet
        const packet = new Uint8Array([0x53, val, 0x00, 0xef]);
        await sendBytes(packet);
        log(`Power toggled: ${isPowerOn ? 'ON' : 'OFF'}`);
    });

    // Pattern/Mode Cycle Button (simulates pressing the physical button on the board)
    modeBtn.addEventListener('click', async () => {
        // Common trigger bytes for hardware flashing modes
        const packet = new Uint8Array([0xbb, 0x01, 0x01, 0x44]);
        await sendBytes(packet);
        log("Cycle pattern command sent.");
    });

    async function sendBytes(byteArray) {
        if (!targetCharacteristic) return;
        try {
            if (targetCharacteristic.properties.writeWithoutResponse) {
                await targetCharacteristic.writeValueWithoutResponse(byteArray);
            } else {
                await targetCharacteristic.writeValueWithResponse(byteArray);
            }
            log(`TX: [${Array.from(byteArray).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}]`);
        } catch (err) {
            log(`Write failed: ${err}`);
        }
    }
</script>
</body>
</html>
