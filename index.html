<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rope Light BLE Controller</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background: var(--card);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            text-align: center;
            color: var(--accent);
        }

        .status-badge {
            text-align: center;
            font-size: 0.9rem;
            padding: 6px 12px;
            border-radius: 20px;
            background: #334155;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-connect { background: #10b981; color: white; }
        .btn-connect:hover { background: #059669; }

        .btn-power { background: #ef4444; color: white; }
        .btn-power:hover { background: #dc2626; }

        .color-picker-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 60px;
            border-radius: 8px;
            cursor: pointer;
            background: transparent;
        }

        #log {
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.8rem;
            color: #a7f3d0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>GATT--DEMO Controller</h1>
    <div id="status" class="status-badge">Status: Disconnected</div>

    <button id="connectBtn" class="btn btn-connect">Connect to GATT--DEMO</button>

    <div class="color-picker-wrapper">
        <label for="colorPicker">Pick Rope Light Color:</label>
        <input type="color" id="colorPicker" value="#ff0000" disabled>
    </div>

    <button id="togglePowerBtn" class="btn btn-power" disabled>Toggle Power</button>

    <h3>BLE Packet Log</h3>
    <div id="log">Click "Connect" to scan for GATT--DEMO...</div>
</div>

<script>
    let bleDevice = null;
    let targetCharacteristic = null;
    let isPowerOn = true;

    const connectBtn = document.getElementById('connectBtn');
    const colorPicker = document.getElementById('colorPicker');
    const togglePowerBtn = document.getElementById('togglePowerBtn');
    const statusDiv = document.getElementById('status');
    const logDiv = document.getElementById('log');

    function log(msg) {
        logDiv.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    connectBtn.addEventListener('click', async () => {
        try {
            log("Scanning for BLE devices...");
            
            // Accept device name prefix GATT-- or GATT--DEMO
            bleDevice = await navigator.bluetooth.requestDevice({
                filters: [{ namePrefix: 'GATT--' }],
                optionalServices: [
                    '0000ffe0-0000-1000-8000-00805f9b34fb', // Generic LED Service UUID 1
                    '0000fff0-0000-1000-8000-00805f9b34fb', // Generic LED Service UUID 2
                    '0000ffd0-0000-1000-8000-00805f9b34fb'  // Alternative Service UUID
                ]
            });

            log(`Found: ${bleDevice.name}`);
            statusDiv.innerText = `Connecting to ${bleDevice.name}...`;

            const server = await bleDevice.gatt.connect();
            log("Connected to GATT Server.");

            // Discover primary services
            const services = await server.getPrimaryServices();
            log(`Discovered ${services.length} primary service(s):`);

            for (const service of services) {
                log(` - Service UUID: ${service.uuid}`);
                const characteristics = await service.getCharacteristics();
                for (const char of characteristics) {
                    log(`   * Char UUID: ${char.uuid} (Write: ${char.properties.write || char.properties.writeWithoutResponse})`);
                    
                    // Automatically grab the first writeable characteristic found
                    if ((char.properties.write || char.properties.writeWithoutResponse) && !targetCharacteristic) {
                        targetCharacteristic = char;
                        log(`--> Selected Write Characteristic: ${char.uuid}`);
                    }
                }
            }

            if (targetCharacteristic) {
                statusDiv.innerText = `Connected: ${bleDevice.name}`;
                colorPicker.disabled = false;
                togglePowerBtn.disabled = false;
                connectBtn.style.display = 'none';
            } else {
                log("Error: No writeable characteristic discovered!");
            }

        } catch (error) {
            log(`Error: ${error}`);
            statusDiv.innerText = "Connection Failed";
        }
    });

    // Send RGB Packet
    colorPicker.addEventListener('input', async (e) => {
        const hex = e.target.value;
        const r = parseInt(hex.substring(1, 3), 16);
        const g = parseInt(hex.substring(3, 5), 16);
        const b = parseInt(hex.substring(5, 7), 16);

        // Common Protocol Format A: 7E 07 05 03 [R] [G] [B] 00 EF
        const packetA = new Uint8Array([0x7E, 0x07, 0x05, 0x03, r, g, b, 0x00, 0xEF]);

        await sendBytes(packetA);
    });

    // Send Power Packet
    togglePowerBtn.addEventListener('click', async () => {
        isPowerOn = !isPowerOn;
        const cmd = isPowerOn ? 0x01 : 0x00;

        // Common Protocol Format A Power Payload: 7E 04 04 [CMD] 00 00 00 00 EF
        const powerPacket = new Uint8Array([0x7E, 0x04, 0x04, cmd, 0x00, 0x00, 0x00, 0x00, 0xEF]);
        
        await sendBytes(powerPacket);
        log(`Power toggled: ${isPowerOn ? 'ON' : 'OFF'}`);
    });

    async function sendBytes(byteArray) {
        if (!targetCharacteristic) return;
        try {
            if (targetCharacteristic.properties.writeWithoutResponse) {
                await targetCharacteristic.writeValueWithoutResponse(byteArray);
            } else {
                await targetCharacteristic.writeValueWithResponse(byteArray);
            }
            log(`TX: [${Array.from(byteArray).map(b => '0x' + b.toString(16).padStart(2, '0')).join(', ')}]`);
        } catch (err) {
            log(`Write failed: ${err}`);
        }
    }
</script>
</body>
</html>
